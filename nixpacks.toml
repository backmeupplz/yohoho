# Node.js and Bun come from a pinned nixpkgs so they get security releases
# (Node.js Oct 2026 security release: 22.23.4).
# nixpkgs only has Bun 1.3.13 at this pin, so its bun package is pointed at the
# official Bun 1.4.4 release (Oct 2026 security fixes); drop the override once
# nixpkgs has bun >= 1.4.4.
[phases.setup]
nixPkgs = [
  "nodejs_22",
  "(bun.overrideAttrs { version = \"1.4.4\"; src = fetchurl { url = \"https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip\"; hash = \"sha256-v4zL+ysLgBWeD5ptFcVTF63YB3U028YTCj7bUvzLOVw=\"; }; })",
]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = ["bun install"]

[start]
cmd = "bun start"

[variables]
NODE_ENV = "production"