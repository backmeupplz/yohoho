[phases.setup]
nixPkgs = ["bun"]

# Node.js from its own nixpkgs pin so it takes security releases without moving
# Bun (Node.js Oct 2026 security release: 22.23.4; the default was EOL nodejs_18).
[phases.node]
nixPkgs = ["nodejs_22"]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = ["bun install"]

[start]
cmd = "bun start"

[variables]
NODE_ENV = "production"